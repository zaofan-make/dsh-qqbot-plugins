<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05102a"/>
      <stop offset="0.55" stop-color="#0a2150"/>
      <stop offset="1" stop-color="#0d3a70"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102a52" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0a1c3a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#66d8f7"/>
      <stop offset="1" stop-color="#1d6fb6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cc9f0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#4cc9f0"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="360" rx="560" ry="340" fill="url(#glow)"/>

  <!-- 标题 -->
  <text x="72" y="112" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="1">model_see</text>
  <text x="74" y="164" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" fill="#9fe3ff">图片进 → 文字出 · 用当前会话的模型看图</text>
  <text x="74" y="204" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="24" fill="#7fb9d8">上下文里不留 image block，不重复烧视觉 token，也不会被上游审核锁死会话</text>

  <!-- ① 输入卡 -->
  <g>
    <rect x="72" y="248" width="288" height="322" rx="20" fill="url(#card)" stroke="#2b6ea8" stroke-width="2"/>
    <text x="96" y="288" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#7fb9d8">images（本地路径 / 网址）</text>
    <rect x="96" y="306" width="120" height="92" rx="10" fill="#0c2340" stroke="#4cc9f0" stroke-width="2"/>
    <circle cx="126" cy="336" r="10" fill="#4cc9f0" opacity="0.85"/>
    <path d="M100 390 L140 350 L168 378 L188 360 L212 390 Z" fill="#2b8fd0" opacity="0.9"/>
    <text x="232" y="342" font-family="Consolas, monospace" font-size="17" fill="#bfe9ff">D:\素材\a.jpg</text>
    <text x="232" y="372" font-family="Consolas, monospace" font-size="17" fill="#bfe9ff">https://…/b.png</text>
    <text x="96" y="442" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#7fb9d8">多图用换行 / 竖线分隔</text>
    <text x="96" y="474" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#7fb9d8">prompt 必填：要它看什么</text>
    <text x="96" y="522" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#5f8db3">本地图按文件头判类型</text>
  </g>

  <!-- 箭头 1 -->
  <line x1="366" y1="409" x2="404" y2="409" stroke="#4cc9f0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ② 工具卡 -->
  <g>
    <rect x="412" y="248" width="368" height="322" rx="20" fill="url(#card)" stroke="#4cc9f0" stroke-width="2.5"/>
    <text x="436" y="292" font-family="Consolas, monospace" font-size="27" font-weight="700" fill="#ffffff">model_see</text>
    <text x="436" y="328" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#9fe3ff">POST {baseURL}/chat/completions</text>
    <text x="436" y="360" font-family="Consolas, monospace" font-size="16" fill="#bfe9ff">model: 当前会话的模型</text>
    <text x="436" y="388" font-family="Consolas, monospace" font-size="16" fill="#bfe9ff">content: [ text, image_url ]</text>
    <text x="436" y="416" font-family="Consolas, monospace" font-size="16" fill="#bfe9ff">Authorization: Bearer &lt;宿主凭据&gt;</text>
    <text x="436" y="462" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#7fb9d8">Key 自动读宿主 credentials</text>
    <text x="436" y="488" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#7fb9d8">模型不支持读图就原样报错</text>
    <text x="436" y="536" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#5f8db3">opencode 自动补 session 头</text>
  </g>

  <!-- 箭头 2 -->
  <line x1="786" y1="409" x2="824" y2="409" stroke="#4cc9f0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ③ 输出卡 -->
  <g>
    <rect x="832" y="248" width="296" height="322" rx="20" fill="url(#card)" stroke="#2b6ea8" stroke-width="2"/>
    <text x="856" y="288" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#7fb9d8">只回文字</text>
    <rect x="856" y="306" width="248" height="176" rx="12" fill="#0c2340" stroke="#2b8fd0" stroke-width="1.5"/>
    <text x="872" y="338" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#d9f2ff">画面：宫殿、王座、四名</text>
    <text x="872" y="364" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#d9f2ff">人物；左下署名「怜奈」，</text>
    <text x="872" y="390" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#d9f2ff">台词「比起那个，现在更</text>
    <text x="872" y="416" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#d9f2ff">应该考虑快出生的孩子吧？」</text>
    <text x="872" y="446" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#d9f2ff">右下角 AUTO 按钮</text>
    <text x="856" y="520" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#9fe3ff">1 张图 · 可多图对比</text>
  </g>

  <!-- 底部三条卖点 -->
  <g>
    <rect x="72" y="606" width="1056" height="104" rx="18" fill="#081a33" stroke="#1f4f7d" stroke-width="1.6"/>
    <text x="98" y="644" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#ff9db1">✕ 不每轮重发图片</text>
    <text x="98" y="674" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7fb9d8">历史里没有 image block</text>
    <text x="470" y="644" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#8ef0c0">✓ 不撞审核锁死会话</text>
    <text x="470" y="674" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7fb9d8">图片只在上游看一次，回来的只有文字</text>
    <text x="840" y="644" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#9fe3ff">✓ 换服务商只改 baseURL</text>
    <text x="840" y="674" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#7fb9d8">deepseek / glm / openai / opencode</text>
  </g>

  <!-- 底部：鲸鱼 + 署名 -->
  <g transform="translate(120 752) scale(0.62)" fill="url(#whale)">
    <path d="M0 42 C 44 -22 148 -44 232 -12 C 272 3 292 28 292 46 C 292 80 208 100 134 90 C 60 80 10 70 0 42 Z"/>
    <path d="M284 42 C 314 10 346 0 370 -8 C 356 24 356 60 370 92 C 346 84 314 74 284 52 Z" fill="#4cc9f0"/>
    <circle cx="74" cy="34" r="8" fill="#05101f"/>
  </g>
  <text x="1100" y="800" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" fill="#4cc9f0" opacity="0.9">dsh-qqbot 扩展包</text>
  <text x="1100" y="838" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#5f8db3">OpenAI 兼容 image_url · 多图一次问</text>
</svg>
